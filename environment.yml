name: difflocks
channels:
  - defaults
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      - torch==2.5.0
      - torchvision==0.20.0
      - torchaudio==2.5.0  # Still compatible with torch 2.5.0
      - numpy==1.24.3
      - scipy==1.10.1
      - scikit-image==0.21.0
      - scikit-learn==1.3.0
      - opencv-python==4.9.0.80
      - imageio==2.31.1
      - imageio-ffmpeg==0.4.8
      - tqdm==4.65.0
      - einops==0.8.1
      - timm==0.9.2
      - mediapipe==0.10.10
      - trimesh==4.0.4
      - jsonmerge==1.9.2
      - dctorch==0.1.2
      - torchdiffeq==0.2.5
      - torchsde==0.2.6
      - accelerate==0.31.0
      - wheel==0.41.2
      - setuptools==59.5.0
      - tensorboard==2.14.0
      - tensorboardX==2.6
      - libigl==2.5.1  # ⚠️ Consider installing via conda, pip version might be partial
      # flash-attn and natten will be installed manually later